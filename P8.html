<html>
<head><title>Registration Form</title>
<style>
        body {
            background: purple;
            text-align: center;
        }
        form {
            background: white;
            width: 300px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 10px;
        }
        h2 {color: purple;}
        input {
            padding: 8px;
            margin: 8px;
            border: 1px solid gray;
            border-radius: 5px;
        }
        input[type="submit"] {
            background: purple;
            color: white;
            cursor: pointer;
        }
</style></head>
<body>
<form onsubmit="return validate()">
<h2>Registration Form</h2>
<input type="text" id="name" placeholder="Name"><br>
<input type="text" id="email" placeholder="Email"><br>
<input type="password" id="pass" placeholder="Password"><br>
<input type="password" id="cpass" placeholder="Confirm Password"><br>
<input type="text" id="phone" placeholder="Phone Number"><br>
<input type="submit" value="Register"></form>
<script>
        function validate() {

            var n = document.getElementById("name").value;
            var e = document.getElementById("email").value;
            var p = document.getElementById("pass").value;
            var cp = document.getElementById("cpass").value;
            var ph = document.getElementById("phone").value;
            if (n == "" || e == "" || p == "" || cp == "" || ph == "") {
                alert("All fields are required");
                return false;
            }
            if (!/^[a-zA-Z0-9._%+-]{2,}@[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}$/.test(e)) {
                alert("Enter valid email");
                return false;
            }
            if (p.length <= 6) {
                alert("Password must have more than 6 characters");
                return false;
            }
            if (p != cp) {
                alert("Passwords do not match");
                return false;
            }
            if (!/^\d{10}$/.test(ph)) {
                alert("Enter valid 10 digit phone number");
                return false;
            }

            alert("Registration Successful!");
            return true;} 
            </script></body>
</html>
