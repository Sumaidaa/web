<html>
<head>
<title>Mouse Over</title>
<body>
<h1 id="text">Hello</h1>
<img  src="/home/ksb/sumaidaa/web/img1" onmouseover="onmouse()" onmouseout="outmouse()" id="image">
<script>
function onmouse()
{
  document.getElementById("text").innerText="Welcome to my page";
  document.getElementById("image").src="/home/ksb/sumaidaa/web/images.jpeg";
}
function outmouse()
{
  document.getElementById("text").innerText="Hello World";
  document.getElementById("image").src="/home/ksb/sumaidaa/web/njr.jpeg";
}
</script>
</body>
</html>
